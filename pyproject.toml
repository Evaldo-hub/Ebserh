[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebserh-ti-study"
version = "1.0.0"
description = "EBSERH TI Study App - Aplicativo de estudos para concurso"
readme = "README_DEPLOY.md"
license = {text = "MIT"}
authors = [
    {name = "EBSERH TI Study Team", email = "contact@ebserh-ti-study.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
]
requires-python = ">=3.11"
dependencies = [
    "Flask==3.0.0",
    "Jinja2==3.1.4",
    "gunicorn==23.0.0",
    "psycopg2-binary==2.9.10",
    "Pillow==10.4.0",
    "python-dotenv==1.0.1",
    "Werkzeug==3.0.3",
    "MarkupSafe==2.1.5",
    "itsdangerous==2.2.0",
    "click==8.1.7",
    "blinker==1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "black==24.10.0",
    "flake8==7.1.0",
]

[project.urls]
Homepage = "https://github.com/ebserh-ti-study/app"
Repository = "https://github.com/ebserh-ti-study/app"
Issues = "https://github.com/ebserh-ti-study/app/issues"

[tool.setuptools]
packages = ["."]
include-package-data = true
zip-safe = false

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
